<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMBAY COACHING CLASSES - STD 10 Social Science Test</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #d97706;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --correct: #16a34a;
            --incorrect: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 24px;
        }

        .header h2 {
            color: var(--accent);
            margin: 5px 0;
            font-size: 18px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            background: #eff6ff;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .q-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .q-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            background: #fff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--secondary);
            background: #f0f9ff;
        }

        .option-btn input[type="radio"] {
            margin-right: 10px;
            accent-color: var(--secondary);
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
        }

        .submit-btn:hover {
            background: var(--secondary);
        }

        .results {
            display: none;
            text-align: center;
            background: #f0fdf4;
            border: 2px solid var(--correct);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .results h2 {
            color: var(--correct);
            margin: 0 0 10px 0;
        }

        .correct-opt {
            background-color: #dcfce7 !important;
            border-color: var(--correct) !important;
            color: #14532d;
            font-weight: bold;
        }

        .incorrect-opt {
            background-color: #fee2e2 !important;
            border-color: var(--incorrect) !important;
            color: #7f1d1d;
        }
    </style>
</head>
<body>

    <div class="info-bar">

function renderQuiz() {
    const container = document.getElementById("questions-container");
    container.innerHTML = "";

    quizData.forEach((data, index) => {
        const qCard = document.createElement("div");
        qCard.className = "q-card";
        qCard.id = `q-card-${index}`;

        const qText = document.createElement("div");
        qText.className = "q-text";
        qText.innerText = data.q;
        qCard.appendChild(qText);

        const optionsGrid = document.createElement("div");
        optionsGrid.className = "options-grid";

        data.options.forEach((opt, optIdx) => {
            const label = document.createElement("label");
            label.className = "option-btn";
            label.id = `opt-label-${index}-${optIdx}`;

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `q${index}`;
            radio.value = optIdx;

            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt));
            optionsGrid.appendChild(label);
        });

        qCard.appendChild(optionsGrid);
        container.appendChild(qCard);
    });
}

function evaluateQuiz() {
    let score = 0;

    quizData.forEach((data, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const card = document.getElementById(`q-card-${index}`);

        // Reset styling
        data.options.forEach((_, optIdx) => {
            const label = document.getElementById(`opt-label-${index}-${optIdx}`);
            label.classList.remove("correct-opt", "incorrect-opt");
        });

        if (selected) {
            const val = parseInt(selected.value);
            if (val === data.answer) {
                score++;
                document.getElementById(`opt-label-${index}-${val}`).classList.add("correct-opt");
            } else {
                document.getElementById(`opt-label-${index}-${val}`).classList.add("incorrect-opt");
                document.getElementById(`opt-label-${index}-${data.answer}`).classList.add("correct-opt");
            }
        } else {
            // Highlight right answer if missed
            document.getElementById(`opt-label-${index}-${data.answer}`).classList.add("correct-opt");
        }
    });

    // Display Results
    const scoreDisplay = document.getElementById("score-display");
    const resultsBox = document.getElementById("results-box");
    const finalScore = document.getElementById("final-score");
    const feedbackMsg = document.getElementById("feedback-msg");

    scoreDisplay.innerText = `Score: ${score} / 96`;
    finalScore.innerText = `You Scored: ${score} / 96 (${((score/96)*100).toFixed(1)}%)`;
    
    if (score >= 80) {
        feedbackMsg.innerText = "Excellent performance! Outstanding knowledge of Social Science objectives.";
    } else if (score >= 50) {
        feedbackMsg.innerText = "Good effort! Review the missed questions highlighted in green.";
    } else {
        feedbackMsg.innerText = "Needs revision. Go through the highlighted correct answers to improve.";
    }

    resultsBox.style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize test on load
